name: study-bot

on:
  schedule:
    # cron은 UTC다. 아래는 KST(UTC+9) 기준으로 환산한 값.
    - cron: "0 * * * *"    # 매시 정각 = 인증 수집
    - cron: "0 0 * * 1-5"  # 09:00 KST 평일 = 그날 퀘스트 게시
    - cron: "0 13 * * *"   # 22:00 KST 매일 = 이탈 감지 + 뱃지
  workflow_dispatch:
    inputs:
      command:
        description: "실행할 명령"
        default: "sync"
        type: choice
        options: [sync, daily, quest, absence, badges]
      dry_run:
        description: "Discord에 쓰지 않고 출력만"
        default: false
        type: boolean

# 두 실행이 겹쳐서 같은 파일을 밀어내지 않게 한다.
concurrency:
  group: study-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 명령 결정
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "0 0 * * 1-5") CMD=quest ;;
            "0 13 * * *")  CMD=daily ;;
            "0 * * * *")   CMD=sync ;;
            *)             CMD="${{ inputs.command || 'sync' }}" ;;
          esac
          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"
          echo "실행할 명령: $CMD"

      - name: 봇 실행
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          python bot/main.py ${{ steps.pick.outputs.cmd }} \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: 기록 커밋
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name  "study-bot"
          git config user.email "study-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore(bot): ${{ steps.pick.outputs.cmd }} $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
